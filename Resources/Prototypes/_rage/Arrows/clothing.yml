# Скафандры

- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseC2ContrabandUnredeemable ]
  id: ClothingOuterHardsuitArrowsNetrunner
  name: Netrunner's Hardsuit "PMC Arrows"
  description: Squad Commander's Hardsuit.
  suffix: Arrows
  components:
  - type: Sprite
    sprite: _rage/Clothing/OuterClothing/Hardsuits/arrows_netrunner.rsi
  - type: Clothing
    sprite: _rage/Clothing/OuterClothing/Hardsuits/arrows_netrunner.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.3
        Heat: 0.3
        Radiation: 0
        Caustic: 0
  - type: ClothingSpeedModifier
    walkModifier: 1.1
    sprintModifier: 1.1
  - type: HeldSpeedModifier
  - type: Item
    size: Huge
    shape:
    - 0,0,3,3
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitArrows
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
      toggleable-clothing: !type:ContainerSlot
      beakerSlot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellArrows
        whitelist:
          tags:
            - PowerCell
  - type: EnergyDomeGenerator
    damageEnergyDraw: 2
    domePrototype: EnergyDomeSmallGreen
  - type: PowerCellDraw
    drawRate: 0
  - type: UseDelay
    delay: 10.0

- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseC2ContrabandUnredeemable ]
  id: ClothingOuterHardsuitArrowsHeavy
  name: Heavy armored Hardsuit "PMC Arrows"
  description: The heavy version of the "PMC Arrows" armored suit provides excellent protection for its wearer.
  suffix: Arrows
  components:
  - type: Sprite
    sprite: _rage/Clothing/OuterClothing/Hardsuits/arrows_gear.rsi
  - type: Clothing
    sprite: _rage/Clothing/OuterClothing/Hardsuits/arrows_gear.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.35
        Heat: 0.35
        Radiation: 0
        Caustic: 0
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: Item
    size: Huge
    shape:
    - 0,0,3,3
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetHardsuitArrows
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
      toggleable-clothing: !type:ContainerSlot
      beakerSlot: !type:ContainerSlot
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellArrows
        whitelist:
          tags:
            - PowerCell
  - type: EnergyDomeGenerator
    damageEnergyDraw: 6
    domePrototype: EnergyDomeSmallGreen
  - type: PowerCellDraw
    drawRate: 0
  - type: UseDelay
    delay: 10.0

- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase, BaseC2ContrabandUnredeemable ]
  id: ClothingHeadHelmetHardsuitArrows
  name: Hardsuit armored helmet "PMC Arrows"
  description: Special Forces Helmet "PMC Arrows"
  suffix: Arrows
  components:
  - type: BreathMask
  - type: Sprite
    sprite: _rage/Clothing/Head/Hardsuits/arrows_helmet.rsi
  - type: Clothing
    sprite: _rage/Clothing/Head/Hardsuits/arrows_helmet.rsi
  - type: PointLight
    color: darkgreen
    radius: 8
    energy: 3
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.80
        Slash: 0.80
        Piercing: 0.80
        Heat: 0.80
        Radiation: 0.80
        Caustic: 0.95

# Гарнитура

